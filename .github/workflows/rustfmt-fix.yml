name: One-shot rustfmt fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rustfmt-fix.yml'

permissions:
  contents: write

jobs:
  format-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Fix owned-path borrow and apply rustfmt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/modules/transport/server.rs')
          source = path.read_text()
          replacements = [
              (
                  '    let Some(route) = native_route(local_path) else {',
                  '    let local_path = local_path.to_owned();\n    let Some(route) = native_route(&local_path) else {',
              ),
              (
                  '    let Some(upstream_path) = upstream_path(local_path) else {',
                  '    let Some(upstream_path) = upstream_path(&local_path) else {',
              ),
              (
                  '        local_path,\n        policy,',
                  '        &local_path,\n        policy,',
              ),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'expected source fragment not found: {old!r}')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY

          cargo fmt --all

      - name: Commit deterministic formatting/fix
        run: |
          if git diff --quiet; then
            echo 'No formatting/fix changes needed.'
            exit 0
          fi
          git config user.name 'TokenSaver Validation Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src tests
          git commit -m 'fix: resolve compile error and apply rustfmt'
          git push origin HEAD:main
