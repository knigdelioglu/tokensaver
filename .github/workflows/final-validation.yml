name: Final Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tauri.conf.json'
      - 'tauri.release.conf.json'
      - 'assets/**'
      - '.github/workflows/final-validation.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'tauri.conf.json'
      - 'tauri.release.conf.json'
      - 'assets/**'
      - '.github/workflows/final-validation.yml'

permissions:
  contents: read

concurrency:
  group: tokensaver-final-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  rust-validation:
    name: Rust / architecture / unit / integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable with lint components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Compile all targets
        run: cargo check --all-targets --all-features

      - name: Clippy with warnings denied
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Full Rust test suite
        run: cargo test --all-targets --all-features -- --nocapture

      - name: Documentation tests
        run: cargo test --doc --all-features -- --nocapture

      - name: CLI help and version smoke
        run: |
          cargo run --quiet -- help
          cargo run --quiet -- version

      - name: Native aging helper scripts are syntactically valid
        run: |
          python3 -m py_compile \
            scripts/live-token-ab.py \
            scripts/live-aging-quality.py \
            scripts/cache-evidence.py \
            scripts/verify-aging-release.py

      - name: Live probes fail closed without explicit quota consent
        run: |
          set +e
          python3 scripts/live-token-ab.py --url http://127.0.0.1:1/v1/responses --model test
          token_status=$?
          python3 scripts/live-aging-quality.py --url http://127.0.0.1:1/v1/responses --model test
          quality_status=$?
          set -e
          test "$token_status" -eq 2
          test "$quality_status" -eq 2

      - name: Cache evidence export stays content-free
        run: |
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/savings.json" <<'JSON'
          {
            "all_time": {
              "events": 12,
              "aged_requests": 4,
              "provider_usage_events": 10,
              "aged_cache": {"usage_events": 4, "input_tokens": 1000, "cached_input_tokens": 800},
              "unaged_cache": {"usage_events": 6, "input_tokens": 1200, "cached_input_tokens": 900}
            }
          }
          JSON
          python3 scripts/cache-evidence.py --savings-file "$tmpdir/savings.json" --output "$tmpdir/cache.json"
          python3 - "$tmpdir/cache.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              data = json.load(handle)
          assert data['schema'] == 'tokensaver-cache-evidence:v1'
          assert data['aged']['usage_events'] == 4
          assert data['unaged']['usage_events'] == 6
          forbidden = ['prompt', 'tool_result', 'receipt', 'credential', 'capability']
          encoded = json.dumps(data).lower()
          assert not any(word in encoded for word in forbidden)
          PY

      - name: Aging release gate fails closed on missing live evidence
        run: |
          tmpdir="$(mktemp -d)"
          printf '%s\n' '{"schema":"tokensaver-live-token-ab:v1","pass":false}' > "$tmpdir/token.json"
          printf '%s\n' '{"schema":"tokensaver-live-aging-quality:v1","pass":false}' > "$tmpdir/quality.json"
          printf '%s\n' '{"schema":"tokensaver-cache-evidence:v1","aged":{},"unaged":{}}' > "$tmpdir/cache.json"
          if python3 scripts/verify-aging-release.py \
            --token-ab "$tmpdir/token.json" \
            --quality "$tmpdir/quality.json" \
            --cache "$tmpdir/cache.json" \
            --skip-doctor; then
            echo 'aging release gate unexpectedly accepted missing evidence' >&2
            exit 1
          fi

      - name: Release verifier must fail closed without evidence
        run: |
          if python3 scripts/verify-release-gates.py; then
            echo 'release verifier unexpectedly accepted missing validation evidence' >&2
            exit 1
          fi
          echo 'release verifier correctly refused packaging without validation evidence'

  macos-validation:
    name: macOS native / Tauri / packaging
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: macOS compile
        run: cargo check --all-targets --all-features

      - name: macOS tests
        run: cargo test --all-targets --all-features -- --nocapture

      - name: macOS release build
        run: cargo build --release

      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version '^2' --locked

      - name: Package app and DMG
        run: bash scripts/package-macos.sh

      - name: Verify package artifacts exist
        run: |
          find target/release/bundle -maxdepth 3 -type d -name '*.app' -print
          find target/release/bundle -maxdepth 3 -type f -name '*.dmg' -print
          test -n "$(find target/release/bundle -maxdepth 3 -type d -name '*.app' -print -quit)"
          test -n "$(find target/release/bundle -maxdepth 3 -type f -name '*.dmg' -print -quit)"

      - name: CLI smoke on macOS binary
        run: |
          ./target/release/tokensaver help
          ./target/release/tokensaver version
          ./target/release/tokensaver status || test $? -eq 1

      - name: Upload macOS bundles for inspection
        uses: actions/upload-artifact@v4
        with:
          name: tokensaver-macos-final-validation
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
