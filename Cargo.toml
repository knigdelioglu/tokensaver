[package]
name = "tokensaver"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["http1", "tokio"] }
brotli = "6"
dirs = "5"
flate2 = "1"
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
toml_edit = "0.22"
zstd = "0.13"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
