[package]
name = "tokensaver"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["http1", "tokio"] }
brotli = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "5"
flate2 = "1"
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = "0.22"
zstd = "0.13"

[build-dependencies]
tauri-build = "2.6.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
